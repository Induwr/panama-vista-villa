<style>
  /* Section colour morphing */
  @property --a1   { syntax: "<color>"; inherits: true; initial-value: #0f766e; }
  @property --a2   { syntax: "<color>"; inherits: true; initial-value: #34d399; }
  @property --soft { syntax: "<color>"; inherits: true; initial-value: #e6f6f1; }

  :root {
    --bg:#faf7f1; --ink:#1b2420; --muted:#55605a; --edge:#ddd5c8; --dock:#ece7de;
    --spring:cubic-bezier(.34,1.56,.64,1); --glide:cubic-bezier(.22,1,.36,1);
    --dir:1; --wa:#17a35f; --wa-d:#0e6b3d;
    transition:--a1 .8s, --a2 .8s, --soft .8s;
  }
  html[data-t=villa]  { --a1:#0f766e; --a2:#34d399; --soft:#e3f6ef; }
  html[data-t=rooms]  { --a1:#c2570c; --a2:#fbbf24; --soft:#fdf0d8; }
  html[data-t=dining] { --a1:#be123c; --a2:#fb923c; --soft:#fde6e1; }
  html[data-t=vibes]  { --a1:#0369a1; --a2:#22d3ee; --soft:#dff1fb; }
  html[data-t=book]   { --a1:#15803d; --a2:#facc15; --soft:#eaf6d8; }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; background:var(--bg); color:var(--ink); overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; position:relative; }
  body.no-scroll { overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(480px circle at var(--mx,50%) var(--my,15%), rgba(255,255,255,.85), transparent 70%),
      radial-gradient(60vmax circle at 5% 0%, color-mix(in srgb, var(--a2) 30%, transparent), transparent 60%),
      radial-gradient(55vmax circle at 100% 100%, color-mix(in srgb, var(--a1) 18%, transparent), transparent 60%); }

  /* පිටුවේ මැදට එන ලොකු Watermark Logo එක */
  body::after {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(750px, 85vw);
    height: min(750px, 85vw);
    background: url('logo.png') no-repeat center / contain;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
  }

  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  :is(.pill,.btn,.fab,.safari-link-btn,.channel-card,.faq-q,.lb-x):focus-visible { outline:3px solid var(--a1); outline-offset:3px; }

  /* ---------- Dock ---------- */
  header { width:100%; position:sticky; top:0; z-index:1000; padding:14px 12px 6px; display:flex; justify-content:center;
    background:linear-gradient(var(--bg) 65%, transparent); }
  .dock-wrap { max-width:100%; overflow-x:auto; scrollbar-width:none; padding:6px 4px 10px; }
  .dock-wrap::-webkit-scrollbar { display:none; }
  .dock { position:relative; display:inline-flex; gap:6px; padding:7px; white-space:nowrap; background:var(--dock);
    border-radius:50px; border:1px solid rgba(255,255,255,.8);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.08), 0 6px 16px rgba(0,0,0,.06); animation:dock-in .9s var(--spring) both; }
  @keyframes dock-in { from { opacity:0; transform:translateY(-20px) rotateX(-30deg); } }
  .well { position:absolute; top:7px; left:0; width:0; height:calc(100% - 14px); border-radius:35px;
    background:linear-gradient(135deg, var(--a1), color-mix(in srgb, var(--a1) 62%, var(--a2)));
    box-shadow:inset 0 3px 6px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.8);
    transition:transform .5s var(--spring), width .5s var(--spring); will-change:transform,width; }
  .pill { position:relative; z-index:1; border:0; padding:10px 18px; font:inherit; font-size:14px; font-weight:600;
    color:var(--muted); background:#fff; border-radius:35px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    box-shadow:0 4px 0 var(--edge), 0 6px 8px rgba(0,0,0,.05);
    transition:transform .28s var(--spring), box-shadow .28s var(--glide), color .25s, background-color .4s; }
  .pill:hover:not(.active) { color:var(--a1); transform:translateY(-2px); box-shadow:0 6px 0 var(--edge), 0 10px 12px rgba(0,0,0,.08); }
  .pill:active { transform:translateY(3px) scale(.97); box-shadow:0 1px 0 var(--edge); transition-duration:.08s; }
  .pill.active { background:transparent; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.3); transform:translateY(2px); box-shadow:none; cursor:default; }

  /* ---------- Stage ---------- */
  main { flex:1; width:100%; z-index:1; display:flex; justify-content:center; padding:18px 16px 110px; perspective:1400px; touch-action:pan-y; }
  .container { width:min(780px,100%); text-align:center; transform-style:preserve-3d; }
  .panel { transform-style:preserve-3d; transform-origin:50% 40%; }
  .panel.out { animation:out .26s ease-in forwards; }
  .panel.in  { animation:in .7s var(--glide) both; }
  @keyframes out { to { opacity:0; transform:translateX(calc(var(--dir) * -70px)) translateZ(-120px) rotateY(calc(var(--dir) * 26deg)); } }
  @keyframes in { from { opacity:0; transform:translateX(calc(var(--dir) * 70px)) translateZ(-120px) rotateY(calc(var(--dir) * -26deg)); } }

  /* Scroll reveal + 3D tilt */
  .rise { opacity:0; }
  .rise.shown { opacity:1; animation:rise .8s var(--spring) var(--d,0ms) backwards; }
  @keyframes rise { from { opacity:0; transform:perspective(800px) translateY(32px) translateZ(-60px) rotateX(-36deg); } }
  .tilt { position:relative; transform:perspective(800px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)); transition:transform .45s var(--glide), box-shadow .3s; }
  .tilt.live { transition:transform .08s linear, box-shadow .3s; box-shadow:0 18px 34px color-mix(in srgb, var(--a1) 22%, transparent) !important; }
  .tilt::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s;
    background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.3), transparent 65%); }
  .tilt.live::after { opacity:1; }

  /* ---------- Photos ---------- */
  .pic { position:relative; display:grid; place-items:center; overflow:hidden; font-size:56px; aspect-ratio:4/3;
    background:linear-gradient(135deg, var(--a2), var(--a1)); }
  .pic img { position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 30%;
    opacity:0; filter:saturate(1.24) contrast(1.05) brightness(1.06); transition:opacity .6s, transform .5s var(--glide), filter .3s; }
  .pic img.ok { opacity:1; cursor:zoom-in; }
  .gallery-card:hover .pic img.ok, .hero-split:hover .hero-photo img.ok { transform:scale(1.03); filter:saturate(1.3) contrast(1.07) brightness(1.08); }

  /* ---------- Split hero ---------- */
  .hero-split { display:grid; grid-template-columns:1fr 1.15fr; gap:22px; align-items:center; text-align:left; margin-bottom:24px; padding:16px;
    background:#fff; border-radius:26px; border:1px solid var(--edge); box-shadow:0 8px 24px rgba(0,0,0,.06); transform-style:preserve-3d; }
  .hero-photo { width:100%; aspect-ratio:var(--ar, 3/4); max-height:520px; border-radius:20px; border:2px solid #fff; font-size:80px;
    box-shadow:0 8px 20px rgba(0,0,0,.12); transform:translateZ(18px); transition:aspect-ratio .4s var(--glide); }
  .hero-photo img { object-position:center 22%; }
  .hero-split-right { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:6px 8px; }

  /* Logo above title (Center) */
  .brand-badge {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
  }
  .brand-badge img {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    object-fit: cover;
  }

  h1 { font-size:clamp(24px,4vw,34px); font-weight:800; letter-spacing:-.5px; line-height:1.15; margin-bottom:8px;
    background:linear-gradient(120deg, var(--a1), color-mix(in srgb, var(--a1) 50%, var(--a2)));
    -webkit-background-clip:text; background-clip:text; color:transparent; width:100%; }
  .tagline { font-size:14.5px; color:var(--muted); line-height:1.55; margin-bottom:14px; text-align:center; }
  .quick { display:flex; flex-direction:column; gap:7px; margin-bottom:18px; width:100%; align-items:center; }
  .quick-chip { width:fit-content; max-width:100%; font-size:12.5px; font-weight:600; line-height:1.35; text-align:center; color:var(--a1); background:var(--soft); padding:6px 12px; border-radius:18px; }

  .sec-head { text-align:left; margin:22px 0 12px; }
  .sec-head h3 { font-size:18px; color:var(--a1); margin-bottom:4px; }
  .sec-head p { font-size:13px; color:var(--muted); }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
  .gallery-card { background:#fff; border-radius:20px; overflow:hidden; text-align:left; border:1px solid var(--edge); box-shadow:0 5px 14px rgba(0,0,0,.05); }
  .gallery-info { padding:14px; }
  .gallery-info h4 { font-size:15px; color:var(--a1); margin-bottom:4px; }
  .gallery-info p { font-size:13px; color:var(--muted); line-height:1.45; }

  /* Prices */
  .price-card { background:#fff; border-radius:22px; padding:18px; text-align:left; border:1px solid var(--edge); box-shadow:0 5px 14px rgba(0,0,0,.05); }
  .price-card.featured { border:2px solid var(--a1); background:linear-gradient(160deg, #fff 55%, var(--soft)); }
  .badge { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:#fff; padding:4px 11px; border-radius:20px; margin-bottom:8px;
    background:linear-gradient(120deg, var(--a1), color-mix(in srgb, var(--a1) 60%, var(--a2))); }
  .price-card h3 { font-size:17px; margin-bottom:6px; }
  .price-val { font-size:26px; font-weight:800; color:var(--a1); font-variant-numeric:tabular-nums; }
  .price-period { font-size:12px; color:var(--muted); }
  .price-desc { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.45; }

  /* Bento */
  .bento { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; text-align:left; margin:18px 0 26px; }
  .bento-item { background:#fff; border-radius:20px; padding:16px; border:1px solid var(--edge); box-shadow:0 4px 12px rgba(0,0,0,.04); overflow:hidden; }
  .icon { display:grid; place-items:center; width:44px; height:44px; border-radius:14px; font-size:24px; margin-bottom:8px;
    background:linear-gradient(135deg, var(--soft), color-mix(in srgb, var(--a2) 45%, #fff)); box-shadow:0 3px 0 color-mix(in srgb, var(--a2) 55%, #fff); }
  .bento-item h4 { font-size:14.5px; color:var(--a1); margin-bottom:3px; }
  .bento-item p { font-size:12.5px; color:var(--muted); line-height:1.4; }

  /* Safari banner */
  .safari-banner { text-align:left; margin:18px 0 24px; padding:24px 20px; border-radius:22px; color:#fff; overflow:hidden;
    background:linear-gradient(135deg, rgba(10,26,22,.86), rgba(22,53,44,.8)), url('kumana.jpg') center 35%/cover no-repeat, #16352c;
    border:1px solid rgba(255,255,255,.25); box-shadow:0 12px 30px rgba(10,26,22,.3); }
  .safari-badge { display:inline-block; margin-bottom:8px; padding:4px 11px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:#3a2a05; background:#f4c552; }
  .safari-banner h3 { font-size:19px; margin-bottom:6px; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .safari-banner p { font-size:13.5px; color:rgba(255,255,255,.92); line-height:1.55; margin-bottom:16px; text-shadow:0 1px 2px rgba(0,0,0,.4); }
  .safari-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .safari-link-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; font-size:13.5px; font-weight:600; border-radius:25px; text-decoration:none;
    color:var(--a1); background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.25); transition:transform .25s var(--spring), box-shadow .25s; }
  .safari-link-btn:hover { transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,.25); }
  .safari-link-btn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
  .safari-link-btn.wa { color:#fff; background:var(--wa); box-shadow:0 3px 0 var(--wa-d); }
  .safari-link-btn.wa:hover { box-shadow:0 5px 0 var(--wa-d); }
  .safari-soon { display:inline-flex; align-items:center; padding:10px 18px; border-radius:25px; font-size:13px; font-weight:600; color:rgba(255,255,255,.85); border:1px dashed rgba(255,255,255,.6); background:rgba(0,0,0,.25); }

  /* Review channels */
  .channel-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:0 0 22px; text-align:left; }
  .channel-card { --c:#003580; --tint:#eef4fc; display:flex; flex-direction:column; justify-content:space-between; gap:12px; padding:16px; border-radius:20px;
    text-decoration:none; color:inherit; cursor:pointer; background:linear-gradient(170deg, #fff 60%, var(--tint)); border:1.5px solid var(--c);
    box-shadow:0 5px 14px rgba(0,0,0,.04); transition:transform .28s var(--spring), box-shadow .28s var(--glide); }
  .channel-card.airbnb { --c:#e0314f; --tint:#fff1f3; }
  .channel-card.maps { --c:#1a73e8; --tint:#f1f6fe; }
  .channel-card:hover { transform:translateY(-3px); box-shadow:0 12px 24px color-mix(in srgb, var(--c) 20%, transparent); }
  .channel-card:active { transform:translateY(1px); }
  .ch-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .ch-name { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; color:var(--c); }
  .ch-ico { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; font-size:16px; background:var(--tint); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--c) 35%, transparent); }
  .ch-badge { background:var(--c); color:#fff; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:12px; white-space:nowrap; }
  .channel-card p { font-size:12.5px; color:var(--muted); line-height:1.45; }
  .ch-cta { font-size:13px; font-weight:700; color:var(--c); }

  /* Reviews */
  .review-card { background:#fff; border-radius:20px; padding:16px; text-align:left; border:1px solid var(--edge); border-top:4px solid var(--a2); box-shadow:0 5px 14px rgba(0,0,0,.05); }
  .stars { color:#f59e0b; font-size:15px; letter-spacing:2px; margin-bottom:6px; }
  .review-card p { font-size:13.5px; color:var(--muted); line-height:1.5; font-style:italic; }
  .review-author { font-size:12px; font-weight:700; color:var(--a1); margin-top:8px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0 24px; }

  /* FAQ accordion */
  .faq { display:grid; gap:10px; text-align:left; margin-bottom:10px; }
  .faq-item { background:#fff; border:1px solid var(--edge); border-radius:18px; box-shadow:0 3px 10px rgba(0,0,0,.03); overflow:hidden; transition:border-color .3s, box-shadow .3s; }
  .faq-item.open { border-color:var(--a1); box-shadow:0 8px 20px color-mix(in srgb, var(--a1) 14%, transparent); }
  .faq-q { width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border:0; background:none; cursor:pointer;
    font:inherit; font-size:14.5px; font-weight:700; color:var(--ink); text-align:left; }
  .faq-q i { flex:none; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; font-style:normal; font-size:18px; line-height:1; color:#fff;
    background:var(--a1); transition:transform .4s var(--spring); }
  .faq-item.open .faq-q i { transform:rotate(135deg); }
  .faq-a { display:grid; grid-template-rows:0fr; visibility:hidden; transition:grid-template-rows .4s var(--glide), visibility 0s .4s; }
  .faq-item.open .faq-a { grid-template-rows:1fr; visibility:visible; transition-delay:0s; }
  .faq-a > div { overflow:hidden; }
  .faq-a p { padding:0 16px 16px; font-size:13.5px; color:var(--muted); line-height:1.55; }

  /* Buttons */
  .btn-wrap { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; font:inherit; font-size:14px; font-weight:600; border:0; border-radius:35px; text-decoration:none; cursor:pointer; user-select:none;
    transition:transform .28s var(--spring), box-shadow .28s var(--glide); }
  .btn-whatsapp { color:#fff; background:linear-gradient(135deg, var(--wa), #0e8f50); box-shadow:0 4px 0 var(--wa-d), 0 9px 18px rgba(23,163,95,.3); }
  .btn-whatsapp:hover { transform:translateY(-2px); box-shadow:0 6px 0 var(--wa-d), 0 14px 22px rgba(23,163,95,.34); }
  .btn-whatsapp:active { transform:translateY(3px); box-shadow:0 1px 0 var(--wa-d); transition-duration:.08s; }
  .btn-secondary, .btn-email { color:var(--a1); background:#fff; box-shadow:0 4px 0 var(--edge), 0 6px 12px rgba(0,0,0,.05); }
  .btn-secondary:hover, .btn-email:hover { transform:translateY(-2px); box-shadow:0 6px 0 var(--edge), 0 10px 14px rgba(0,0,0,.07); }
  .btn-secondary:active, .btn-email:active { transform:translateY(3px); box-shadow:0 1px 0 var(--edge); transition-duration:.08s; }

  /* WhatsApp button */
  .fab { position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:900; width:58px; height:58px; border-radius:50%;

    box-shadow:0 5px 0 var(--wa-d), 0 12px 24px rgba(23,163,95,.42); transition:transform .28s var(--spring), box-shadow .28s; animation:fab-in 1s var(--spring) 1s backwards; }

  }

  function select(key, focus) {
    if (key === current || !data[key]) return;
    root.style.setProperty('--dir', order.indexOf(key) > order.indexOf(current) ? 1 : -1);
    setActive(key);
    root.dataset.t = key;
    moveWell(activePill());
    activePill().scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    if (focus) activePill().focus();
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    clearTimeout(timer);
    stage.classList.remove('in'); stage.classList.add('out');
    timer = setTimeout(() => {
      render(key);
      stage.classList.remove('out'); void stage.offsetWidth; stage.classList.add('in');
      if (scrollY > 120) scrollTo({ top: 0, behavior: 'smooth' });
    }, 260);
  }

  pills.forEach(p => p.addEventListener('click', () => select(p.dataset.key)));

  stage.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) return select(go.dataset.go);
    const q = e.target.closest('.faq-q');
    if (q) {
      const item = q.parentElement, open = !item.classList.contains('open');
      item.classList.toggle('open', open);
      q.setAttribute('aria-expanded', open);
    }
  });

  document.querySelector('.dock').addEventListener('keydown', e => {
    const i = order.indexOf(current);
    const map = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: order.length - 1 };
    if (!(e.key in map)) return;
    e.preventDefault();
    select(order[(map[e.key] + order.length) % order.length], true);
  });

  let sx = 0, sy = 0;
  main.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  main.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      const k = order.indexOf(current) + (dx < 0 ? 1 : -1);
      if (k >= 0 && k < order.length) select(order[k]);
    }
  }, { passive: true });

  const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'),
        lbcap = document.getElementById('lbcap'), lbx = document.getElementById('lbx');
  let lastFocus;
  const closeLb = () => {
    lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
    lastFocus && lastFocus.focus && lastFocus.focus();
  };
  stage.addEventListener('click', e => {
    const img = e.target.closest('.pic img.ok'); if (!img) return;
    lastFocus = document.activeElement;
    lbimg.src = img.src; lbimg.alt = img.alt; lbcap.textContent = img.alt;
    lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll'); lbx.focus();
  });
  lb.addEventListener('click', closeLb);
  addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) closeLb(); });

  if (!reduce && canHover) {
    addEventListener('pointermove', perFrame(e => {
      document.body.style.setProperty('--mx', e.clientX + 'px');
      document.body.style.setProperty('--my', e.clientY + 'px');
    }));
    stage.addEventListener('pointermove', perFrame(e => {
      const el = e.target.closest && e.target.closest('.tilt'); if (!el) return;
      const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      const k = r.width > 500 ? 4 : 10;
      el.classList.add('live');
      el.style.setProperty('--ty', ((px - .5) * k).toFixed(2) + 'deg');
      el.style.setProperty('--tx', ((.5 - py) * k).toFixed(2) + 'deg');
      el.style.setProperty('--gx', px * 100 + '%'); el.style.setProperty('--gy', py * 100 + '%');
    }));
    stage.addEventListener('pointerout', e => {
      const el = e.target.closest('.tilt');
      if (!el || el.contains(e.relatedTarget)) return;
      el.classList.remove('live'); el.style.setProperty('--tx', '0deg'); el.style.setProperty('--ty', '0deg');
    });
  }

  /* Background Image Preloader (Tabs මාරු කරද්දී Lag වීම නැති කිරීමට) */
  const preloadList = [
    "hero.jpg", "room1.jpg", "guest-dining.jpg", "living.jpg",
    "guest-welcome.jpg", "garden.jpg", "bath.jpg", "room2.jpg",
    "veranda.jpg", "breakfast.jpg", "kumana.jpg"
  ];
  window.addEventListener('load', () => {
    preloadList.forEach(src => {
      const img = new Image();
      img.src = src;
    });
  });

  /* Init */
  document.getElementById('fab').href = wa("Hi Panama Vista Villa! I have a question.");
  const start = location.hash.slice(1);
  setActive(data[start] ? start : 'villa');
  render(current);
  moveWell(activePill(), true);
  addEventListener('resize', () => moveWell(activePill(), true));
  addEventListener('load', () => moveWell(activePill(), true));
  addEventListener('hashchange', () => select(location.hash.slice(1)));
</script>

</body>
</html>
